[platformio]
default_envs = t5-47

[env:t5-47]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
; LilyGO T5 4.7" e-ink driver (large vendor lib, uncomment to build the display target)
; lib_deps = https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git

[env:test]
platform = native
test_framework = unity
